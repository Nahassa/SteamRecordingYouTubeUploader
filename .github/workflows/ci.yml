name: CI

# Compiling and packaging are separate jobs on purpose.
#
# Proving the code builds is wanted on every push. Producing a self-contained,
# single-file, ReadyToRun executable is not: it is the slow part of the run and it
# leaves a ~105MB artifact behind. Running both together meant ten work-in-progress
# commits produced a gigabyte of artifacts nobody asked for, so packaging now happens
# only when a binary is actually wanted.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Superseded runs on a feature branch or pull request are cancelled: pushing three
# commits in a row should not occupy a Windows runner three times. Runs on main, on a
# release and on a manual trigger produce something, so those always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
     || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Test core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Restoring the test project pulls Core in through its ProjectReference.
      # MSBuild accepts one project per invocation, so naming both here fails
      # with MSB1008 rather than restoring the pair.
      - name: Restore
        run: dotnet restore tests/SteamClipRemuxer.Core.Tests

      - name: Test
        run: >-
          dotnet test tests/SteamClipRemuxer.Core.Tests
          --configuration Release --no-restore
          --logger "console;verbosity=normal"

  build:
    name: Compile solution (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SteamClipRemuxer.sln

      # The Linux SDK omits the WindowsDesktop targeting pack, so this is the only
      # place the WinForms GUI is compiled at all. Worth doing on every push even
      # though nothing is packaged here.
      - name: Build solution (includes the WinForms GUI)
        run: dotnet build SteamClipRemuxer.sln --configuration Release --no-restore

      - name: Test against the Windows build
        run: dotnet test tests/SteamClipRemuxer.Core.Tests --configuration Release --no-build

  package:
    name: Publish executables (Windows)
    needs: [test, build]
    runs-on: windows-latest
    # Only when a binary is actually wanted. workflow_dispatch is deliberately not
    # restricted to main: running the workflow by hand against a feature branch is how
    # a change gets tested before it is merged.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'release'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Only the release upload below writes, and only on a release event.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $v = $Matches[1] }
          else { $v = $env:GITHUB_SHA.Substring(0, 7) }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      # Separate output folders: two self-contained single-file publishes into one
      # directory overwrite each other's runtime files.
      - name: Publish GUI and CLI
        shell: pwsh
        run: |
          dotnet publish src/SteamClipRemuxer.Gui -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish/gui
          dotnet publish src/SteamClipRemuxer.Cli -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish/cli

      - name: Collect the executables
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/gui/SteamClipRemuxer.exe "dist/SteamClipRemuxer-$v-win-x64.exe"
          Copy-Item publish/cli/sclip.exe "dist/sclip-$v-win-x64.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: SteamClipRemuxer-${{ steps.version.outputs.version }}
          path: dist/
          # A hand-triggered build is for trying a branch out, so it expires sooner
          # than the build of main people may come back to.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 30 }}
          if-no-files-found: error

      # Uploaded with the runner's own gh rather than a third-party action, so the
      # write token is never handed to code outside this repository.
      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release upload '${{ github.event.release.tag_name }}' `
            "dist/SteamClipRemuxer-$v-win-x64.exe" `
            "dist/sclip-$v-win-x64.exe" --clobber
